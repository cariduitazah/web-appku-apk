<script>
// === FUNGSI FORMAT TANGGAL: 2026-10-14 → "14 Oct 2026" ===
function formatTanggal(tglString) {
  if (!tglString) return '-';
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  const [thn, bln, tgl] = tglString.split('-').map(Number);
  return `${tgl} ${bulan[bln - 1]} ${thn}`;
}

// UI Control
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const hamburgerBtn = document.getElementById('hamburgerBtn');
const backdrop = document.getElementById('backdrop');
const settingToggle = document.getElementById('settingToggle');
const settingSubmenu = document.getElementById('settingSubmenu');
const searchBtn = document.getElementById('searchBtn');
const searchOverlay = document.getElementById('searchOverlay');
const closeSearch = document.getElementById('closeSearch');
const searchInput = document.getElementById('searchInput');
const moreBtn = document.getElementById('moreBtn');
const navDropdown = document.getElementById('navDropdown');

function isMobile(){return window.innerWidth<=768}
hamburgerBtn.addEventListener('click', ()=>{
  if(isMobile()){sidebar.classList.toggle('mobile-open');backdrop.classList.toggle('show',sidebar.classList.contains('mobile-open'))}
  else{const c=sidebar.classList.toggle('collapsed');main.classList.toggle('full',c)}
});
backdrop.addEventListener('click', ()=>{sidebar.classList.remove('mobile-open');backdrop.classList.remove('show')});
settingToggle.addEventListener('click', ()=>{settingToggle.classList.toggle('open');settingSubmenu.classList.toggle('open')});
// === Pencarian yang mengarah ke Index ===
searchBtn.addEventListener('click', () => {
  searchOverlay.classList.add('open');
  setTimeout(() => searchInput.focus(), 100);
});

closeSearch.addEventListener('click', () => {
  searchOverlay.classList.remove('open');
  searchInput.value = '';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    searchOverlay.classList.remove('open');
    searchInput.value = '';
  }
});

// Saat mengetik & tekan Enter → pindah ke index dengan kata kunci
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const kata = searchInput.value.trim();
    if (kata) {
      // Langsung buka index + kirim kata kunci
      window.location.href = `index.html?cari=${encodeURIComponent(kata)}`;
    }
  }
});

moreBtn.addEventListener('click',e=>{e.stopPropagation();navDropdown.classList.toggle('show')});
document.addEventListener('click',()=>navDropdown.classList.remove('show'));
navDropdown.addEventListener('click',e=>e.stopPropagation());

// Database
if (!window.db) {
  window.db = {
    baca: async function(nama) {
      try {
        return await window.electronAPI.bacaData(nama) || [];
      } catch {
        return [];
      }
    },
    tulis: async function(nama, isi) {
      try {
        return await window.electronAPI.tulisData(nama, isi);
      } catch {
        return { sukses: false };
      }
    }
  };
}


// Treeview Logic
let semuaKategori=[], semuaSub=[], semuaArt=[];

async function muatSemua(){
  [semuaKategori, semuaSub, semuaArt] = await Promise.all([
    window.db.baca('kategori'),
    window.db.baca('subkategori'),
    window.db.baca('artikel')
  ]);
  tampilkanPohon();
}

function tampilkanPohon(){
  const wadah = document.getElementById('pohon');
  wadah.innerHTML = semuaKategori.map(kat=>{
    const subDariKat = semuaSub.filter(s=>s.id_kat===kat.id);
    return `
      <li class="tree-item">
        <div class="tree-toggle" onclick="toggleSaya(this)">
          <span class="tree-icon">▶</span>
          <span class="tree-nama"><i class="fa-solid fa-folder-open" style="color:#fe8606;"></i> ${kat.nama}</span>
        </div>
        <ul class="tree-kelompok tree-sembunyi" style="padding-left:20px;list-style:none">
          ${subDariKat.length===0
            ? '<li style="padding:6px 8px;color:#94a3b8;font-size:14px">Belum ada subkategori</li>'
            : subDariKat.map(sub=>{
                const artDariSub = semuaArt.filter(a=>a.id_sub===sub.id);
                return `
                  <li class="tree-item">
                    <div class="tree-toggle" onclick="toggleSaya(this)">
                      <span class="tree-icon">▶</span>
                      <span class="tree-nama">📂 ${sub.nama}</span>
                    </div>
                    <ul class="tree-kelompok tree-sembunyi" style="padding-left:20px;list-style:none">
                      ${artDariSub.length===0
                        ? '<li style="padding:6px 8px;color:#94a3b8;font-size:14px">Belum ada artikel</li>'
                        : artDariSub.map(art=>`
                            <li class="tree-item">
                              <div class="tree-artikel" onclick="bukaArtikel(${art.id}, this)">
                                📄 ${art.judul}
                              </div>
                            </li>
                          `).join('')
                      }
                    </ul>
                  </li>
                `;
              }).join('')
          }
        </ul>
      </li>
    `;
  }).join('');
}

function toggleSaya(el){
  const ikon = el.querySelector('.tree-icon');
  const isi = el.nextElementSibling;
  ikon.classList.toggle('buka');
  isi.classList.toggle('tree-sembunyi');
}

function bukaArtikel(id, el){
  document.querySelectorAll('.tree-artikel').forEach(i=>i.classList.remove('aktif'));
  el.classList.add('aktif');
  setTimeout(()=>location.href=`detail.html?id=${id}`, 200);
}

window.addEventListener('resize',()=>{if(!isMobile()){sidebar.classList.remove('mobile-open');backdrop.classList.remove('show')}});

muatSemua();
</script>
