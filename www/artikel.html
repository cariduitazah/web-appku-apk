<!-- MAIN -->
<div id="main">

    <div class="navbar-left">

      <a href="#">Nama Thema</a>
    </div>

  <div class="content">
    <h1>Manajemen Artikel</h1>

    <form id="formArtikel" class="card">
      <input type="hidden" id="idArt">
      <div>
        <label>Subkategori:</label>
        <select id="idSubOpt" required>
          <option value="">-- Pilih Subkategori --</option>

      </div>
      <div>
        <label>Tanggal:</label>
        <input type="date" id="tglArt" required>

<br>
    
	 <h2>DATA ARTIKEL</h2>
  <div class="tbl-header">
    <table cellpadding="0" cellspacing="0" border="0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Subkategori</th>
          <th>Tanggal</th>
          <th>Judul</th>
         <th>Opsi</th>
        </tr>
      </thead>
    </table>
  </div>
	<div class="tbl-content">
    <table cellpadding="0" cellspacing="0" border="0">
      <tbody id="daftarArtikel"></tbody>
    </table>
  
    </div>
  </div>
</div>

<script>
// UI Control
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const hamburgerBtn = document.getElementById('hamburgerBtn');
const backdrop = document.getElementById('backdrop');
const settingToggle = document.getElementById('settingToggle');
const settingSubmenu = document.getElementById('settingSubmenu');
const searchBtn = document.getElementById('searchBtn');
const searchOverlay = document.getElementById('searchOverlay');
const closeSearch = document.getElementById('closeSearch');
const searchInput = document.getElementById('searchInput');
const moreBtn = document.getElementById('moreBtn');
const navDropdown = document.getElementById('navDropdown');

function isMobile(){return window.innerWidth<=768}

hamburgerBtn.addEventListener('click', ()=>{
  if(isMobile()){
    sidebar.classList.toggle('mobile-open');
    backdrop.classList.toggle('show', sidebar.classList.contains('mobile-open'));
  }else{
    const isCollapsed = sidebar.classList.toggle('collapsed');
    main.classList.toggle('full', isCollapsed);
  }
});

backdrop.addEventListener('click', ()=>{
  sidebar.classList.remove('mobile-open');
  backdrop.classList.remove('show');
});

settingToggle.addEventListener('click', ()=>{
  settingToggle.classList.toggle('open');
  settingSubmenu.classList.toggle('open');
});

searchBtn.addEventListener('click', ()=>{
  searchOverlay.classList.add('open');
  setTimeout(()=>searchInput.focus(), 100);
});

closeSearch.addEventListener('click', ()=>{
  searchOverlay.classList.remove('open');
  searchInput.value = '';
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    searchOverlay.classList.remove('open');
    searchInput.value = '';
  }
  if(e.key==='Enter' && searchOverlay.classList.contains('open') && searchInput.value.trim()){
    window.location.href = `index.html?cari=${encodeURIComponent(searchInput.value.trim())}`;
  }
});

searchInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const kata = searchInput.value.trim();
    if(kata){
      window.location.href = `index.html?cari=${encodeURIComponent(kata)}`;
    }
  }
});

moreBtn.addEventListener('click', e=>{
  e.stopPropagation();
  navDropdown.classList.toggle('show');
});

document.addEventListener('click', ()=>navDropdown.classList.remove('show'));
navDropdown.addEventListener('click', e=>e.stopPropagation());

// Database
if (!window.db) {
  window.db = {
    baca: async function(nama) {
      try {
        return await window.electronAPI.bacaData(nama) || [];
      } catch {
        return [];
      }
    },
    tulis: async function(nama, isi) {
      try {
        return await window.electronAPI.tulisData(nama, isi);
      } catch {
        return { sukses: false };
      }
    }
  };
}


// Format Tanggal
function formatTanggal(tglString){
  if(!tglString) return '-';
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  const [thn, bln, tgl] = tglString.split('-').map(Number);
  return `${tgl} ${bulan[bln - 1]} ${thn}`;
}

// TinyMCE Editor
tinymce.init({
  selector: '#isiArt',
  plugins: 'lists link image code',
  toolbar: 'undo redo | bold italic | bullist numlist | link image |  code',
  height: 250
});

// Logic
let artList = [], subList = [];
const form = document.getElementById('formArtikel');
const tbody = document.getElementById('daftarArtikel');

async function muatPilihanSub(){
  subList = await window.db.baca('subkategori');
  const sel = document.getElementById('idSubOpt');
  sel.innerHTML = '<option value="">-- Pilih Subkategori --</option>'
    + subList.map(s=>`<option value="${s.id}">${s.nama}</option>`).join('');
}

async function muatArtikel(){
  artList = await window.db.baca('artikel');
  artList.sort((a,b)=>b.tgl.localeCompare(a.tgl));
  render();
}

function render(){
  tbody.innerHTML = artList.map(a=>{
    const nmSub = subList.find(s=>s.id===a.id_sub)?.nama || '-';
    return `<tr>
      <td>${a.id}</td>
      <td>${nmSub}</td>
      <td>${formatTanggal(a.tgl)}</td>
      <td>${a.judul}</td>
      <td>
        <button onclick="edit(${a.id})">Ubah</button>
        <button onclick="hapus(${a.id})">Hapus</button>
      </td>
    </tr>`;
  }).join('');
}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const id = document.getElementById('idArt').value;
  const id_sub = parseInt(document.getElementById('idSubOpt').value);
  const tgl = document.getElementById('tglArt').value;
  const judul = document.getElementById('judulArt').value.trim();
  const isi = tinymce.get('isiArt').getContent();
  if(!id_sub || !tgl || !judul) return;
  
  if(id){
    const i = artList.findIndex(x=>x.id == id);
    artList[i] = {...artList[i], id_sub, tgl, judul, isi};
  }else{
    const idB = artList.length ? Math.max(...artList.map(x=>x.id)) + 1 : 1;
    artList.push({id: idB, id_sub, tgl, judul, isi});
  }
  
  await window.db.tulis('artikel', artList);
  form.reset();
  tinymce.get('isiArt').setContent('');
  document.getElementById('tglArt').valueAsDate = new Date();
  muatPilihanSub();
  muatArtikel();
});

window.edit = function(id){
  const a = artList.find(x=>x.id === id);
  document.getElementById('idArt').value = a.id;
  document.getElementById('idSubOpt').value = a.id_sub;
  document.getElementById('tglArt').value = a.tgl;
  document.getElementById('judulArt').value = a.judul;
  tinymce.get('isiArt').setContent(a.isi);
};

window.hapus = async function(id){
  if(!confirm('Yakin hapus?')) return;
  artList = artList.filter(x=>x.id !== id);
  await window.db.tulis('artikel', artList);
  muatArtikel();
};

window.addEventListener('resize', ()=>{
  if(!isMobile()){
    sidebar.classList.remove('mobile-open');
    backdrop.classList.remove('show');
  }
});

// Set tanggal hari ini
document.getElementById('tglArt').valueAsDate = new Date();

muatPilihanSub();
muatArtikel();
</script>
<script>$(window).on("load resize ", function() {
  var scrollWidth = $('.tbl-content').width() - $('.tbl-content table').width();
  $('.tbl-header').css({'padding-right':scrollWidth});
}).resize();</script>
</body>
</html>
