<script>
// Elemen UI
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const hamburgerBtn = document.getElementById('hamburgerBtn');
const backdrop = document.getElementById('backdrop');
const settingToggle = document.getElementById('settingToggle');
const settingSubmenu = document.getElementById('settingSubmenu');
const searchBtn = document.getElementById('searchBtn');
const searchOverlay = document.getElementById('searchOverlay');
const closeSearch = document.getElementById('closeSearch');
const searchInput = document.getElementById('searchInput');
const moreBtn = document.getElementById('moreBtn');
const navDropdown = document.getElementById('navDropdown');

function isMobile(){return window.innerWidth<=768}

// Toggle Sidebar
hamburgerBtn.addEventListener('click', ()=>{
  if(isMobile()){
    sidebar.classList.toggle('mobile-open');
    backdrop.classList.toggle('show', sidebar.classList.contains('mobile-open'));
  }else{
    const isCollapsed = sidebar.classList.toggle('collapsed');
    main.classList.toggle('full', isCollapsed);
  }
});
backdrop.addEventListener('click', ()=>{
  sidebar.classList.remove('mobile-open');
  backdrop.classList.remove('show');
});

// Toggle Submenu Editor
settingToggle.addEventListener('click', ()=>{
  settingToggle.classList.toggle('open');
  settingSubmenu.classList.toggle('open');
});

// Search Overlay
searchBtn.addEventListener('click', ()=>{
  searchOverlay.classList.add('open');
  setTimeout(()=>searchInput.focus(), 100);
});
closeSearch.addEventListener('click', ()=>{
  searchOverlay.classList.remove('open');
  resetCari();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    searchOverlay.classList.remove('open');
    resetCari();
  }
});

// Dropdown Navbar
moreBtn.addEventListener('click', e=>{
  e.stopPropagation();
  navDropdown.classList.toggle('show');
});
document.addEventListener('click', ()=>navDropdown.classList.remove('show'));
navDropdown.addEventListener('click', e=>e.stopPropagation());

// === FUNGSI FORMAT TANGGAL ===
function formatTanggal(tglString){
  if(!tglString) return '-';
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  const [thn, bln, tgl] = tglString.split('-').map(Number);
  return `${tgl} ${bulan[bln - 1]} ${thn}`;
}

// Data & Logika
let semuaArtikel = [], daftarKategori = [], daftarSubkategori = [];
let filterKatTerpilih = '', kataKunci = '';
const perHalaman = 5;
let halamanSkrg = 1;

async function muatSemua(){
  [semuaArtikel, daftarKategori, daftarSubkategori] = await Promise.all([
    window.db.baca('artikel'),
    window.db.baca('kategori'),
    window.db.baca('subkategori')
  ]);
  semuaArtikel.sort((a,b)=>b.tgl.localeCompare(a.tgl));

  // Baca kata kunci dari URL
  const params = new URLSearchParams(window.location.search);
  const kataDariLink = params.get('cari');
  if(kataDariLink){
    kataKunci = kataDariLink;
    searchInput.value = kataKunci;
    history.replaceState({}, document.title, 'index.html');
  }

  isiPilihanKategori();
  tampil();
}

function isiPilihanKategori(){
  const sel = document.getElementById('filterKat');
  sel.innerHTML = '<option value="">-- Semua Kategori --</option>'
    + daftarKategori.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('');
}

function terapkanFilter(){
  filterKatTerpilih = document.getElementById('filterKat').value;
  halamanSkrg = 1;
  tampil();
}

function getNamaKategoriDariSub(id_sub){
  const sub = daftarSubkategori.find(s=>s.id===id_sub);
  if(!sub) return '-';
  const kat = daftarKategori.find(k=>k.id===sub.id_kat);
  return kat ? kat.nama : '-';
}

function dapatkanArtikelTerfilter(){
  let hasil = semuaArtikel;
  if(filterKatTerpilih){
    const idKat = parseInt(filterKatTerpilih);
    const idSubTerpilih = daftarSubkategori.filter(s=>s.id_kat===idKat).map(s=>s.id);
    hasil = hasil.filter(a=>idSubTerpilih.includes(a.id_sub));
  }
  if(kataKunci){
    const k = kataKunci.toLowerCase();
    hasil = hasil.filter(a=>
      a.judul.toLowerCase().includes(k) || a.isi.toLowerCase().includes(k)
    );
  }
  return hasil;
}

function potongTeks(html, panjang=180){
  const teks = html.replace(/<[^>]*>/g, '');
  return teks.length>panjang ? teks.slice(0,panjang)+'...' : teks;
}

function tampil(){
  const dataTerfilter = dapatkanArtikelTerfilter();
  const mulai = (halamanSkrg-1)*perHalaman;
  const dataHal = dataTerfilter.slice(mulai, mulai+perHalaman);
  const div = document.getElementById('daftarArtikel');
  const info = document.getElementById('infoCari');

  if(kataKunci){
    info.style.display = 'block';
    document.getElementById('teksKata').textContent = `"${kataKunci}" — ${dataTerfilter.length} hasil ditemukan`;
  }else{
    info.style.display = 'none';
  }

  if(dataHal.length===0){
    div.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px">Tidak ada artikel yang cocok</p>';
    document.getElementById('paginasi').innerHTML = '';
    return;
  }

  div.innerHTML = dataHal.map(a=>`
    
	
	
      <h3><a href="detail.html?id=${a.id}" class="baca-selengkapnya"> ${a.judul}</a></h3>
      
     <div> ${potongTeks(a.isi)}</div>
     
   `).join('');

  const totalHal = Math.ceil(dataTerfilter.length/perHalaman) || 1;
  document.getElementById('paginasi').innerHTML = `
    Halaman ${halamanSkrg} dari ${totalHal} &nbsp;
    ${halamanSkrg>1 ? `<button onclick="gantiHal(${halamanSkrg-1})">← Sebelumnya</button>` : ''}
    ${halamanSkrg<totalHal ? `<button onclick="gantiHal(${halamanSkrg+1})">Selanjutnya →</button>` : ''}
  `;
}

window.gantiHal = function(hal){ halamanSkrg = hal; tampil(); };

searchInput.addEventListener('input', e=>{
  kataKunci = e.target.value.trim();
  halamanSkrg = 1;
  tampil();
});

window.resetCari = function(){
  kataKunci = '';
  searchInput.value = '';
  halamanSkrg = 1;
  tampil();
};

window.addEventListener('resize', ()=>{
  if(!isMobile()){
    sidebar.classList.remove('mobile-open');
    backdrop.classList.remove('show');
  }
});

// Pastikan db tersedia
if (!window.db) {
  window.db = {
    baca: async function(nama) {
      try {
        return await window.electronAPI.bacaData(nama) || [];
      } catch {
        return [];
      }
    },
    tulis: async function(nama, isi) {
      try {
        return await window.electronAPI.tulisData(nama, isi);
      } catch {
        return { sukses: false };
      }
    }
  };
}


muatSemua();
</script>
