<script>
// === FUNGSI FORMAT TANGGAL: 2026-10-14 → "14 Oct 2026" ===
function formatTanggal(tglString) {
  if (!tglString) return '-';
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  const [thn, bln, tgl] = tglString.split('-').map(Number);
  return `${tgl} ${bulan[bln - 1]} ${thn}`;
}

// UI Control
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const hamburgerBtn = document.getElementById('hamburgerBtn');
const backdrop = document.getElementById('backdrop');
const settingToggle = document.getElementById('settingToggle');
const settingSubmenu = document.getElementById('settingSubmenu');
const copyBtn = document.getElementById('copyBtn');
const pdfBtn = document.getElementById('pdfBtn');
const backBtn = document.getElementById('backBtn');

function isMobile(){return window.innerWidth<=768}
hamburgerBtn.addEventListener('click', ()=>{
  if(isMobile()){sidebar.classList.toggle('mobile-open');backdrop.classList.toggle('show',sidebar.classList.contains('mobile-open'))}
  else{const c=sidebar.classList.toggle('collapsed');main.classList.toggle('full',c)}
});
backdrop.addEventListener('click', ()=>{sidebar.classList.remove('mobile-open');backdrop.classList.remove('show')});
settingToggle.addEventListener('click', ()=>{settingToggle.classList.toggle('open');settingSubmenu.classList.toggle('open')});
backBtn.addEventListener('click', ()=>history.back());

// Database
if (!window.db) {
  window.db = {
    baca: async function(nama) {
      try {
        return await window.electronAPI.bacaData(nama) || [];
      } catch {
        return [];
      }
    },
    tulis: async function(nama, isi) {
      try {
        return await window.electronAPI.tulisData(nama, isi);
      } catch {
        return { sukses: false };
      }
    }
  };
}


// Ambil ID dari URL
const idArtikel = parseInt(new URLSearchParams(location.search).get('id'));
let semuaArt=[], semuaSub=[], semuaKat=[];

async function muat(){
  [semuaArt, semuaSub, semuaKat] = await Promise.all([
    window.db.baca('artikel'),
    window.db.baca('subkategori'),
    window.db.baca('kategori')
  ]);
  const art = semuaArt.find(a=>a.id===idArtikel);
  if(!art){
    document.querySelector('.content').innerHTML='<p style="text-align:center;padding:50px">Artikel tidak ditemukan</p>';
    return;
  }
  const sub = semuaSub.find(s=>s.id===art.id_sub);
  const kat = sub ? semuaKat.find(k=>k.id===sub.id_kat) : null;

  document.getElementById('judulArt').textContent = art.judul;
  document.getElementById('metaArt').textContent = 
  `📅 ${formatTanggal(art.tgl)} | 📂 ${kat?.nama||'-'} → ${sub?.nama||'-'}`;

  document.getElementById('isiArt').innerHTML = art.isi;
}

// Salin
copyBtn.addEventListener('click', async ()=>{
  const teks = document.getElementById('judulArt').textContent + '\n' +
                document.getElementById('metaArt').textContent + '\n\n' +
                document.getElementById('isiArt').innerText;
  await navigator.clipboard.writeText(teks);
  copyBtn.textContent='✅ Tersalin';
  setTimeout(()=>copyBtn.textContent='📋', 2000);
});

// Ekspor PDF
pdfBtn.addEventListener('click', async ()=>{
  const el = document.getElementById('areaCetak');
  const opt = {
    margin: 15,
    filename: document.getElementById('judulArt').textContent + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  await html2pdf().set(opt).from(el).save();
});

window.addEventListener('resize',()=>{if(!isMobile()){sidebar.classList.remove('mobile-open');backdrop.classList.remove('show')}});
muat();
</script>
