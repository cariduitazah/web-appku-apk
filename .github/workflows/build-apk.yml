name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Android Environment & Licenses
        run: |
          # Beritahu sistem di mana letak Android SDK
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Buat file local.properties (Sangat Penting agar Gradle tidak bingung)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # Terima semua lisensi Android (Wajib!)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Build APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          # Tambahkan --no-daemon agar tidak kehabisan memori di server GitHub
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Hasil-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk